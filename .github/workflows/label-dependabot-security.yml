name: Label Dependabot security updates

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  label-security-update:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Dependabot PR
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      # Workaround for https://github.com/dependabot/fetch-metadata/issues/719
      # fetch-metadata v3.1.0 can return an empty alert-state for genuine security
      # update PRs. Until that issue is fixed in a release, query GitHub's exact
      # alert -> Dependabot update -> pull request relationship directly.
      - name: Add security label when linked to an open alert
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TEST_DEPENDABOT_PR_LABEL_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          alerts="$(
            gh api graphql --paginate --slurp \
              -F owner="$OWNER" \
              -F repository="$REPOSITORY" \
              -f query='
                query($owner: String!, $repository: String!, $endCursor: String) {
                  repository(owner: $owner, name: $repository) {
                    vulnerabilityAlerts(first: 100, after: $endCursor, states: [OPEN]) {
                      nodes {
                        dependabotUpdate {
                          pullRequest { number }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              '
          )"

          is_security="$(
            jq -r --argjson pr "$PR_NUMBER" '
              any(
                .[].data.repository.vulnerabilityAlerts.nodes[]?;
                .dependabotUpdate.pullRequest.number == $pr
              )
            ' <<< "$alerts"
          )"

          if [[ "$is_security" != "true" ]]; then
            echo "No open Dependabot alert is linked to PR #$PR_NUMBER."
            exit 0
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f 'labels[]=security' \
            --silent

          echo "Added the security label to PR #$PR_NUMBER."
