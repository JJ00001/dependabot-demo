name: Label Dependabot security updates

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label-security-update:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          alert-lookup: true
          github-token: ${{ secrets.PERSONAL_TEST_DEPENDABOT_PR_LABEL_TOKEN }}

      - name: Add security label
        if: steps.metadata.outputs.alert-state != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TEST_DEPENDABOT_PR_LABEL_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >
          gh api
          --method POST
          "repos/$GH_REPO/issues/$PR_NUMBER/labels"
          -f 'labels[]=security'
